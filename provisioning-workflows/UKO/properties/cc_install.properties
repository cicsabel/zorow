###################################################################
# File section
###################################################################

# Set the location of where CC, Liberty and Java are installed
JAVA_HOME=/java/java17_64
# Where is the server code installed, typical values are
# /usr/lpp/IBM/uko/v3r1/cc for crypto connect, MSDKE or CAT support
# /usr/lpp/IBM/uko/v3r1/ccacsp for ACSP
SERVER_INSTALL_DIR=/usr/lpp/IBM/uko/v3r1/cc
# Liberty installation directory, only required for a Liberty server, not ACSP
WLP_INSTALL_DIR=/usr/lpp/liberty_zos/current

# Set zFS configuration properties.
# a dataset will be created and mounted in a subdir with the server name
SERVER_USER_DIR=/etc/liberty
# if specified, a dataset will be created and mounted in a subdir with the server name
SERVER_OUTPUT_DIR=/var/liberty
# Dataset HLQ for the 2 zFS datasets to be created, 
# which will be mounted to the server and output directory
SERVER_FILE_SYSTEM_HLQ=UKO.CC.ZFS
# VOLUME value that is used in the creation of the zFS data sets, for example, SYSDA. 
# If the value is specified as SMS (Storage Management Subsystem), 
# VOLUME and DATACLASS are omitted from the VSAM creation.
# Otherwise, you will need to specify DATACLASS as well
ZOS_VSAM_VOLUME=SMS 	
# If you don't use SMS, you must also specify the DATACLASS for VSAM creation.
# If you use SMS, you can omit this parameter as it will be ignored
# ZOS_ZFS_DATACLASS=ZFSDC

# The proclib dataset into which the proc for starting the server and agent
# will be created.
ZOS_PROCLIB=USER.PROCLIB
ZOS_PARMLIB=USER.PARMLIB

###################################################################
# CC users parameters
###################################################################
# Flags used by the ccusers template and workflows to decide, whether to create groups and/or users.
# Note that these flags will lead to the creation of ALL users/groups

# user IDs and groups required for CC setup
# If CREATE_TECHNICAL_USER_GROUPS is true, the groups with the specified values will be created:
# SERVER_STC_GROUP, WLP_UNAUTHENTICATED_GROUP, GENERIC_CLIENT_GROUP
CREATE_TECHNICAL_USER_GROUPS=true
TECHNICAL_SUPERIOR_GROUP=SYS1
# If CREATE_TECHNICAL_USERIDS is true, the users with the specified values will be created:
# SERVER_STC_USER, WLP_UNAUTHENTICATED_USER, GENERIC_CLIENT_USER
CREATE_TECHNICAL_USERIDS=true

# Directory of the user homes, required for technical users
USER_HOME_PARENT_DIR=/u

###################################################################
# Server keyring and certificate parameters
###################################################################
# Flags used by the cckeyring workflows to decide, whether to create CA, keygring(s) or certificates

# Flag, whether to create the CA to be used to sign the certificates
SERVER_CREATE_CA=false
# The label of the CA to be used to sign the generated certificates
# The CA will also be added to the keyring
SERVER_CA_LABEL=UkoLibertyCA

# CN, OU and O values for generating CA if requested,
# if more or fewer DN-components are needed, the JCL can be modifed in the workflow.
SERVER_CA_CN=certauth
SERVER_CA_OU=security
SERVER_CA_O=org

# Flag, whether to create the keyring(s)
SERVER_CREATE_KEYRING=true
# if SERVER_USE_KEYRING_AS_TRUST_STORE is set to true, then 
# the value for SERVER_TLS_TRUST_STORE_KEY_RING will be ignored and
# the name of SERVER_TLS_KEY_STORE_KEY_RING will be used for both, key and trust store and 
# no separate trust ring is created. 
SERVER_USE_KEYRING_AS_TRUST_STORE=true

# Flag, whether to create all certificates 
SERVER_CREATE_CERTIFICATES=false

# CN, OU and O values for generating certificates if requested,
# if more or fewer DN-components are needed, the JCL can be modifed in the workflow.
SERVER_TLS_KEY_STORE_SERVER_CERT_CN=uko.example.com
SERVER_TLS_KEY_STORE_SERVER_CERT_OU=security
SERVER_TLS_KEY_STORE_SERVER_CERT_O=ORG

# -------------------------------------------------------
# parameters that are required by the UKO Server
# -------------------------------------------------------

# Keyring value containing the required certificates and CAs
SERVER_TLS_KEY_STORE_KEY_RING=UkoKeyRing
SERVER_TLS_TRUST_STORE_KEY_RING=UkoKeyRing

# TLS Server certificate name
SERVER_TLS_KEY_STORE_SERVER_CERT=UkoLibertyServer
# Certificate for OpenID Connect (OIDC), used to sign the json web token
# only required for a Liberty Server, not ACSP
SERVER_OIDC_PROVIDER_CERT=UkoOpenid 

###################################################################
# (Optional) Client certificate parameters
###################################################################
# The following parameters are only relevant if you want to create
# a client CA and certificate

# The label of the CA to be used to sign the generated certificates
# The CA will also be added to the server keyring
#CLIENT_CA_LABEL=CC06CU.CA

# CN, OU and O values for generating CA if requested,
# if more or fewer DN-components are needed, the JCL can be modifed in the workflow.
#CLIENT_CA_CN=CC06CU.CA
CLIENT_CA_OU=Liberty
CLIENT_CA_O=IBM

# Label of the client certificate
#CLIENT_CERT_LABEL=CC06CU.MTLS

# CN, OU and O values for generating the client certificate,
# if more or fewer DN-components are needed, the JCL can be modifed in the workflow.
CLIENT_CERT_CN=Client certificate
CLIENT_CERT_OU=CCCC
CLIENT_CERT_O=IBM

# export parameters for the client certificate
EXPORT_PATH=/tmp
EXPORT_PASSWORD=zaqwsx
EXPORT_HLQ=UKO.TEMP.CERT

###################################################################
# Server parameters
###################################################################
# started task name of the server
SERVER_STC_NAME=CCSERV

# SAF prefix to be used for APPL access
# - Liberty: also used as prefix for EJBROLE definitions
# - ACSP: default is ACSPPROD, will be used for definition in APPL class 
#         and auth.map.applid in server properties
SAF_PROFILE_PREFIX=EKMFWEB

# -------------------------------------------------------
# Userids and groups required for the Server
# -------------------------------------------------------

# Started task userid for the server and the corresponding parent group
SERVER_STC_USER=CCSU
SERVER_STC_GROUP=CCSG

# Unauthenticated user, the default is WSGUEST, and the corresponding parent group
# This is only required for a Liberty server, not ACSP
WLP_UNAUTHENTICATED_USER=CCUU
WLP_UNAUTHENTICATED_GROUP=CCUG

# Optional generic client userid and corresponding parent group,
# can represent Crypto Connect, CC CAT or CC ACSP Clients
# and will be used to grant access to clients
GENERIC_CLIENT_USER=CCGU
GENERIC_CLIENT_GROUP=CCGG

# -------------------------------------------------------
# network properties
# -------------------------------------------------------
# -1 means that this type of connectivity is disabled
# Otherwise indicates the port number that the server will be listening on
SERVER_PORT_NOTLS=-1
SERVER_PORT_TLS=443
# JMX monitoring port, only relevant for ACSP server
#CONFIGURATION_PORT=9050

# -------------------------------------------------------
# other Liberty server related properties
# -------------------------------------------------------

# If you want to use mTLS to connect to the HTTPS port in a Liberty server, 
# set ENABLE_MTLS_VIA_HTTPS_PORT to true
ENABLE_MTLS_VIA_HTTPS_PORT=true

# Angel name, only relevant for a Liberty server, not ACSP
# If a name is specified, the server will connect to this named angel, 
# otherwise to the default angel
WLP_ANGEL_NAME=UKOANG

#CC_TRACE_OPTIONS="*=info:com.ibm.ccc.ekmf.*=info:com.ibm.ccc.cryptoconnect.*=info:com.ibm.ccc.crypto.*=info"

###################################################################
# Key name parameters
###################################################################

# The key prefix is used to generate a KEY_PREFIX.** profile 
# in the CSFKEYS class and grant access to the server
KEY_PREFIX=CC

###################################################################
# Other
###################################################################

# Directory for creating temporary files
TEMP_DIR=/tmp

# SAF owner to be used when creating SAF profiles
SAF_OWNER=RACFADMN

###################################################################
# ACSP
###################################################################
# Number of the ACSP Server security extensions SVC which are used 
# for mapping client certificates to z/OS user IDs. 
# This setting is only used if the authorization feature has been enabled 
# by using the auth.check parameter in the acsp.server.properties. 
# The ACSP security SVC must have been installed and this number been specified 
# as SVCNUMDEC. If nothing is specified, then router SVC 109,220 is the default. 
ACSP_AUTH_MAP_SVC=254

# Specify the ICSF release in use, you can find it by issuing the /F ICSF command 
ICSF_RELEASE=HCR77D2

# LPA library for ACSP SVCs
CC_LPALIB=KMG.SKMGLPA
# ACSP sample library, containing for example KMGZPARM
CC_SAMPLIB=KMG.SKMGSAMP

###################################################################
# MSDKE parameters
###################################################################
# This section is only required, if you are using MSDKE

# Will connection to Microsoft Double Key Encryption be required
MSDKE_SUPPORT_REQUIRED=true

# Should the integrated test HTTP service for MSDKE be enabled? Note that this is not
# recommended for production
MSDKE_ENABLE_HTTP_SERVICE=false

# Label of the certificate used for mTLS authentication with rabbitM
MSDKE_RABBIT_CERT=MSDKE.SERVICE

# CA that signed the certificate used for mTLS authentication with rabbitMQ
MSDKE_RABBIT_CA="RABBIT CA CLOUD"

# The URI to use when connecting to a Rabbit MQ server
MSDKE_RABBIT_URI=amqps://amqp.rabbit.ccc.eu-de.containers.appdomain.cloud:443

# The KEK label to use when decrypting keys in MSDKE
# ==> Example: MSDKE.RSA.KEK00001
MSDKE_WRAPPING_KEK_LABEL=ROBOT.MSDKE.WRAPPING.KEK

# Rabbit MQ virtual host, to separate e.g. test from development queues
#MSDKE_RABBIT_VIRTUAL_HOST=/

# A comma-separated list of trusted keys; they are printed out by UKO
# and/or other instances of MSDKE Crypto service when the server starts
#MSDKE_EC_TRUSTED_KEYS_X509_,,,,
MSDKE_EC_TRUSTED_KEYS_X509_ENCODED=*

# The EC identity key label to use by this MSDKE Crypto Service
MSDKE_EC_IDENTITY_KEY_LABEL=EKMF.WEB.IDENTITY.KEY

# -------------------------------------------------------
# MSDKE database parameters
# -------------------------------------------------------
# At least one of the MSDKE services needs access to the keystore database

# MSDKE Keystore Db2 location on z/OS
# required in the server.env configuration
# ==> Example: CPHMVSF_DB2F
DB_LOCATION=DSNV133N

# ==> Example: KRYTESTO
DB_CURRENT_SCHEMA=KRYTEST1

# Db2 lib path parameter, required for server.env
# ==> Example: /usr/lpp/db2c10/db2c10/jdbc/lib
DB_LIBPATH=/db2/db2v13/jdbc/lib
# Db2 class path parameter, required for server.env
# ==> Example: /usr/lpp/db2c10/db2c10/jdbc/classes
DB_CLASSPATH=/db2/db2v13/jdbc/classes

# -------------------------------------------------------
# database access
# -------------------------------------------------------
# To grant access to the MSDKE views, the following parameters are required

# HLQ where Db2 is installed, also required for the server started task
DB_HLQ=SYS2.DB2.V13
# The Db2 SSID, also required by the server jvm.options file 
DB_JCC_SSID=DL3N
# PROGRAM, PLAN and LIB parameters to execute GRANT
DB_PROGRAM=DSNTEP2
DB_PLAN=DSNTEP13
DB_RUNLIB=DSNV133N.RUNLIB.LOAD

###################################################################
# Crypto Connect parameters
###################################################################
# This section is only required, if you are using Crypto Connect

# Should the Crypto Connect encrypt and decrypt service be enabled?
CRYPTO_CONNECT_SUPPORT_REQUIRED=true

###################################################################
# CAT parameters
###################################################################
# This section is only required, if you are using CAT

# Should the CAT service be enabled? This parameter is required to congifure the required
# configDropins in the Liberty server
CAT_SUPPORT_REQUIRED=false
# High level dataset qualifier of MVS work data sets to be used (created and deleted)
CAT_TEMP_HLQ=
# User or group that will get access to run the CAT collection
CAT_AGENT_USER=

# Installation location of the Z Open Automation Utility
ZOAU_HOME=/usr/lpp/IBM/zoau/v1r3
# Path to Kafka installation location
KAFKA_HOME=/local/kafka/kafka/2.8.1
# Folder where CAT is installed
CAT_INSTALL_DIR=/usr/lpp/IBM/uko/v3r1/cccat
# Location where the adjusted CAT configuration files will be placed
CAT_USER_DIR=/var/cccat
# Libary containing the Agent's load modules
AGENT_RUNLIB=KMG.SKMGMOD0

# hostname or IP address and port of Kafka server, e.g. example.com:9092
# ==> Example: winmvs3n.hursley.ibm.com:9092
CAT_KAFKA_URI=
# System wide unique ID of UKO CAT agent instance, each deployed instance must have it's own ID
CAT_KAFKA_TRANSACTIONAL_ID=
# CAT PostgreSQL database connection parameters
# ==> Example: jdbc:postgresql://9.20.10.46:5432/crypto?currentSchema=uko
# The CAT server will create the required tables under the specified schema. 
# If no schema is specified, the default schema `public` is used, which is not recommended.
CAT_CORE_DB_URL=
CAT_CORE_DB_USER=cccat
# Use the security utility, described here:
# https://www.ibm.com/docs/en/was-liberty/zos?topic=applications-securityutility-command
# To encrypt the password
CAT_CORE_DB_PASSWORD=changeme

# GDG base for dumped SMF data sets for catsmf.conf, if specified, SMFGDGDONE is required
SMFGDGBASE=CPPSS.SMFDUMP.MV3N
# Name of the latest SMF generation already handled, must be specified with SMFGDGBASE and will be updated 
# in catsmf.conf after each collection 
SMFGDGDONE=G4499V00
